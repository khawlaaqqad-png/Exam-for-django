<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GYM</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <div class="header">
        <h1>Edit show</h1>
        <P><a href="/shows">Tv show</a>       <a href="/logout">logout</a></P>
    </div>
    <div class="header">
    </div>
    <div>
        <form method="POST" action="/edit_show/{{ show.id }}">
                {% csrf_token %}
                {% if messages %}
                {% for message in messages %}
                    <p>{{ message }}</p>
                {% endfor %}
                {% endif %} 
                <div class="form-row">
                    <label>Title:</label>
                    <input type="text" name="title" value="{{ show.title }}" required>
                </div>

                <div class="form-row">
                    <label>Network:</label>
                    <input type="text" name="network" value="{{ show.network }}" required>
                </div>

                <div class="form-row">
                    <label>Release Date:</label>
                    <input type="date" name="release_date" value="{{ show.release_date|date:'Y-m-d' }}" required>
                </div>

                <div class="form-row">
                    <label>Comments:</label>
                    <input type="text" name="comments" value="{{ show.comments }}" required>
                </div>

                <button type="submit">Edit</button>
            </form>
    </div>
</body>
</html>
